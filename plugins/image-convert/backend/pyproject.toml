[project]
name = "alltools-image-convert"
version = "0.1.0"
description = "Offline image conversion plugin for AllTools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pillow>=10.0,<13"
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9"
]

[project.scripts]
alltools-image-convert = "alltools_image_convert:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alltools_image_convert"]
