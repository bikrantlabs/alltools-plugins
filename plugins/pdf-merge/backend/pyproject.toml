[project]
name = "alltools-pdf-merge"
version = "0.1.0"
description = "Offline PDF merge plugin for AllTools"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pypdf>=5.0,<6"
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9"
]

[project.scripts]
alltools-pdf-merge = "alltools_pdf_merge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alltools_pdf_merge"]
